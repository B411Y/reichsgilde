# ─────────────────────────────────────────────────────────────────────────────
#  Automatische Prüfung für Reichsgilde (GitHub Actions)
#
#  Läuft bei jedem Pull Request und jeder Änderung auf "main":
#    1. Bauen + Tests auf Windows UND Linux
#    2. Das Spiel für Windows und Linux exportieren und kurz starten
#
#  Ergebnis: grüner Haken = alles in Ordnung, rotes Kreuz = etwas ist kaputt.
#  Die fertigen Spiel-Builds liegen danach unter "Actions" → Lauf → "Artifacts".
#  Manuell starten: Actions → "Build, Tests & Export" → "Run workflow".
# ─────────────────────────────────────────────────────────────────────────────
name: Build, Tests & Export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_VERSION: "8.0.x"

jobs:
  tests:
    name: Build & Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Projektmappe bauen
        run: dotnet build Reichsgilde.sln --configuration Debug

      - name: Tests ausführen
        run: dotnet run --project tests/Reichsgilde.Core.Tests --no-build

  export:
    name: Spiel exportieren (Windows + Linux)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Godot aus dem Zwischenspeicher holen
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-windows

      - name: Godot und Exportvorlagen herunterladen
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d ~/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          ziel=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$ziel"
          # Nur die Vorlagen für Windows und Linux auspacken (spart über 1 GB).
          unzip -q -j templates.tpz 'templates/linux_*.x86_64' 'templates/windows_*_x86_64*.exe' templates/version.txt -d "$ziel"
          rm godot.zip templates.tpz

      - name: Godot bereitstellen
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Exportieren
        run: |
          mkdir -p build/linux build/windows
          "$GODOT" --headless --path game --export-release "Linux"
          "$GODOT" --headless --path game --export-release "Windows"
          ls -la build/linux build/windows

      - name: Prüfen, ob der C#-Code mitexportiert wurde
        run: |
          # Godot meldet einen fehlgeschlagenen C#-Build nur als Warnung.
          # Ohne diesen Ordner würde das Spiel zwar starten, aber kein Skript ausführen.
          ls -d build/linux/data_Reichsgilde_*   || { echo "::error::C#-Daten fehlen im Linux-Export";   exit 1; }
          ls -d build/windows/data_Reichsgilde_* || { echo "::error::C#-Daten fehlen im Windows-Export"; exit 1; }

      - name: Linux-Build kurz starten (Rauchtest)
        run: |
          set -o pipefail   # ein Absturz des Spiels soll den Schritt fehlschlagen lassen
          chmod +x build/linux/Reichsgilde.x86_64
          # 1. normaler Start   2. mit Bedienfeld, Innenansicht, Jahresbericht, Ratskammer, Familientafel, Gerichtssaal, Hinterzimmer und hohem Tempo (mehr Code wird durchlaufen)
          build/linux/Reichsgilde.x86_64 --headless --quit-after 300 2>&1 | tee start.log
          build/linux/Reichsgilde.x86_64 --headless --quit-after 600 -- --verwalten=1 --innen=1 --tempo=8 --startstunde=4 --bericht=1 --rat=1 --familie=1 --gericht=1 --hinterzimmer=1 2>&1 | tee -a start.log
          # „leaked" fängt Speicherlecks beim Beenden (z. B. Knoten, die nie in den Szenenbaum kamen)
          if grep -E "ERROR|Unhandled exception|leaked" start.log; then
            echo "::error::Das exportierte Spiel meldet Fehler beim Start"
            exit 1
          fi

      - name: Linux-Build bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Reichsgilde-Linux
          path: build/linux

      - name: Windows-Build bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Reichsgilde-Windows
          path: build/windows
