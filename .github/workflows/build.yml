# ─────────────────────────────────────────────────────────────────────────────
#  Automatische Prüfung für Reichsgilde (GitHub Actions)
#
#  Läuft bei jedem Pull Request und jeder Änderung auf "main":
#    1. Bauen + Tests auf Windows UND Linux
#    2. Das Spiel für Windows und Linux exportieren und kurz starten
#
#  Ergebnis: grüner Haken = alles in Ordnung, rotes Kreuz = etwas ist kaputt.
#  Die fertigen Spiel-Builds liegen danach unter "Actions" → Lauf → "Artifacts".
#  Manuell starten: Actions → "Build, Tests & Export" → "Run workflow".
# ─────────────────────────────────────────────────────────────────────────────
name: Build, Tests & Export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_VERSION: "8.0.x"

jobs:
  tests:
    name: Build & Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Projektmappe bauen
        run: dotnet build Reichsgilde.sln --configuration Debug

      - name: Tests ausführen
        run: dotnet run --project tests/Reichsgilde.Core.Tests --no-build

  export:
    name: Spiel exportieren (Windows + Linux)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: .NET installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Godot aus dem Zwischenspeicher holen
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-windows

      - name: Godot und Exportvorlagen herunterladen
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d ~/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          ziel=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$ziel"
          # Nur die Vorlagen für Windows und Linux auspacken (spart über 1 GB).
          unzip -q -j templates.tpz 'templates/linux_*.x86_64' 'templates/windows_*_x86_64*.exe' templates/version.txt -d "$ziel"
          rm godot.zip templates.tpz

      - name: Godot bereitstellen
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Exportieren
        run: |
          mkdir -p build/linux build/windows
          "$GODOT" --headless --path game --export-release "Linux"
          "$GODOT" --headless --path game --export-release "Windows"
          ls -la build/linux build/windows

      - name: Prüfen, ob der C#-Code mitexportiert wurde
        run: |
          # Godot meldet einen fehlgeschlagenen C#-Build nur als Warnung.
          # Ohne diesen Ordner würde das Spiel zwar starten, aber kein Skript ausführen.
          ls -d build/linux/data_Reichsgilde_*   || { echo "::error::C#-Daten fehlen im Linux-Export";   exit 1; }
          ls -d build/windows/data_Reichsgilde_* || { echo "::error::C#-Daten fehlen im Windows-Export"; exit 1; }

      - name: Linux-Build kurz starten (Rauchtest)
        timeout-minutes: 20   # Notbremse, falls trotz der Zeitgrenze unten etwas hängt
        run: |
          set -o pipefail   # ein Absturz des Spiels soll den Schritt fehlschlagen lassen
          chmod +x build/linux/Reichsgilde.x86_64
          # Stürzt das Spiel ab, landet ein Speicherabbild (Core-Dump) im Arbeitsordner – für die Rückverfolgung unten.
          ulimit -c unlimited || true
          sudo sysctl -q -w kernel.core_pattern="$PWD/kern.%p" || true
          # Ein Start mit Zeitgrenze ($GRENZE Sekunden, sonst 180). Hängt das Spiel, bekommt es SIGABRT: Das schreibt ebenfalls
          # ein Speicherabbild, die Rückverfolgung zeigt dann, wo es hängt. Hilft das nicht, folgt nach 20 s SIGKILL.
          # (Ein von außen geschicktes SIGSEGV ließ das Spiel am 16.10.2026 hängen statt abstürzen – der Lauf stand 6 Stunden.)
          starte() {
            local status=0
            timeout -s ABRT -k 20 "${GRENZE:-180}" build/linux/Reichsgilde.x86_64 --headless "$@" 2>&1 | tee -a start.log || status=$?
            case $status in
              0) return 0 ;;
              124|137) FEHLER="hängt (nach ${GRENZE:-180} s abgebrochen)" ;;
              *) FEHLER="ist abgestürzt (Rückgabewert $status)" ;;
            esac
            return 1
          }
          # 1. normaler Start   2. mit Bedienfeld, Innenansicht, Jahresbericht, Ratskammer, Familientafel, Gerichtssaal, Hinterzimmer und hohem Tempo (mehr Code wird durchlaufen)
          rauchtest() {
            : > start.log
            starte --quit-after 300 || return 1
            echo "=== zweiter Start (mit Tafeln) ===" | tee -a start.log
            starte --quit-after 600 -- --verwalten=1 --innen=1 --tempo=8 --startstunde=4 --bericht=1 --rat=1 --familie=1 --gericht=1 --hinterzimmer=1 || return 1
          }
          # Nach einem Absturz oder Hänger: Welcher Faden war es und wo? Ein Absturz beim Beenden kam schon ohne jede Meldung
          # von Godot (16.10.2026) – die Fadennamen zeigen, ob es Godot selbst war oder die .NET-Laufzeit (z. B. „.NET Finalizer“).
          # Die volle Ausgabe steht in rueckverfolgung.txt (Artefakt „Rauchtest-Protokoll“), der Anfang als Anmerkung.
          absturz() {
            echo "::error::Das exportierte Spiel $FEHLER – Rückverfolgung im Artefakt „Rauchtest-Protokoll“"
            local abbild
            abbild=$(ls -t kern.* 2>/dev/null | head -1) || true   # ohne Abbild schlägt ls fehl
            if [ -n "$abbild" ]; then
              sudo apt-get install -y -qq gdb > /dev/null 2>&1
              gdb -batch -ex "info threads" -ex "bt 30" -ex "thread apply all bt 15" \
                build/linux/Reichsgilde.x86_64 "$abbild" > rueckverfolgung.txt 2>&1 || true
              rm -f kern.*   # das Abbild ist mehrere hundert MB groß – die Rückverfolgung genügt
              head -60 rueckverfolgung.txt | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }' > anmerkung.txt
              echo "::error title=Rauchtest – Rückverfolgung::$(cat anmerkung.txt)"
            else
              echo "Kein Speicherabbild gefunden – nur start.log." | tee rueckverfolgung.txt
            fi
            exit 1
          }
          # „leaked" fängt Speicherlecks beim Beenden (z. B. Knoten, die nie in den Szenenbaum kamen)
          MUSTER="ERROR|Unhandled exception|leaked"
          # Fundstellen mit Folgezeilen als Anmerkung (Stufe $1): Sie stehen oben in der Zusammenfassung des Laufs
          # und sind über die API lesbar, ohne das ganze Protokoll zu laden.
          anmerken() {
            grep -E -B1 -A6 "$MUSTER|=== zweiter Start" start.log | head -80 \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }' > anmerkung.txt
            echo "::$1 title=$2::$(cat anmerkung.txt)"
          }
          rauchtest || absturz
          if grep -qE "$MUSTER" start.log; then
            # Manche Meldungen kommen nur sporadisch (z. B. ein Leck beim Beenden, je nach Zeitpunkt). Deshalb ein
            # zweiter Versuch: Erst wenn er wieder etwas findet, schlägt der Schritt fehl. Der erste Fund bleibt als Warnung sichtbar.
            anmerken warning "Rauchtest, 1. Versuch – Fundstellen (wird wiederholt)"
            cp start.log start-1.log
            rauchtest || absturz
            if grep -qE "$MUSTER" start.log; then
              echo "::error::Das exportierte Spiel meldet Fehler beim Start (in zwei Versuchen)"
              anmerken error "Rauchtest, 2. Versuch – Fundstellen"
              exit 1
            fi
          fi

      - name: Rauchtest-Protokoll bereitstellen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Rauchtest-Protokoll
          path: |
            start.log
            start-1.log
            rueckverfolgung.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Linux-Build bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Reichsgilde-Linux
          path: build/linux

      - name: Windows-Build bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Reichsgilde-Windows
          path: build/windows
